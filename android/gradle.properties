org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Avast Antivirus's SSL-scanning feature intercepts HTTPS with its own
# locally-generated root cert, trusted at the Windows OS level but not by
# any JDK's own separate cacerts bundle — breaking Gradle's dependency
# downloads specifically (confirmed: `curl`, using Windows' trust store,
# connects fine; every JDK-based tool couldn't). Fixed by importing
# Avast's root cert into this JDK's cacerts directly (the
# E:\Softwares copy — user-writable, unlike the Program Files one, which
# needs admin rights this session doesn't have). Scoped to this project
# only, not a system-wide JAVA_HOME change.
org.gradle.java.home=E:/Softwares/jdk-21.0.10.7-hotspot
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler cannot compute relative paths across drive
# letters (project is on E:, Gradle/pub caches are on C:) — disable it.
kotlin.incremental=false
